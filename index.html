<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is Wonderland | Face Painting Counter</title>
    <meta name="theme-color" content="#000000">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-screen">

        <img src="assets/logo.png" alt="This is Wonderland" class="logo">

        <h1>Face Painting Counter</h1>

        <p class="subtitle">
            This is Wonderland 2026
        </p>

        <label for="operator">Chi sei?</label>

        <input
            type="text"
            id="operator"
            placeholder="Inserisci il tuo nome">

        <button id="startButton">
            Inizia
        </button>

    </main>

    <script src="app.js"></script>

</body>

</html>
