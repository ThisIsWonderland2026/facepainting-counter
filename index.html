<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>This is Wonderland | Face Painting Counter</title>
    <meta name="theme-color" content="#000000">

    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<<body>


<!-- PAGINA LOGIN -->

<main id="loginPage" class="login-screen">

    <img src="assets/logo.png" class="logo">

    <h1>
        Face Painting Counter
    </h1>


    <p class="subtitle">
        This is Wonderland 2026
    </p>


    <label for="operator">
        Chi sei?
    </label>


    <input
        type="text"
        id="operator"
        placeholder="Inserisci il tuo nome">


    <button id="startButton">
        Inizia
    </button>


</main>




<!-- PAGINA COUNTER -->

<main id="counterPage" class="counter-screen hidden">


    <h1>
        Face Painting Counter
    </h1>


    <div>
        👤 Operatore:
        <span id="operatorName"></span>
    </div>


    <div>
        📅 Data:
        <span id="date"></span>
    </div>



 <section class="counter-card">

    <div class="counter-title">
        <span class="icon">👧</span>
        <h2>KID</h2>
    </div>


    <button onclick="registra('Bambino')">
        +1
    </button>


    <p>
        Totale:
        <span id="childrenTotal">
            0
        </span>
    </p>

</section>




   <section class="counter-card">

    <div class="counter-title">
        <span class="icon">👨</span>
        <h2>ADULT</h2>
    </div>


        <button onclick="registra('Adulto')">
            +1
        </button>


        <p>
            Totale:
            <span id="adultTotal">
                0
            </span>
        </p>

    </section>




    <h2>
        👥 TOTALE GIORNATA
    </h2>


    <span id="dayTotal">
        0
    </span>




    <button 
        id="undoButton"
        onclick="annullaUltimaRegistrazione()"
        disabled>

        ↩ Annulla ultima registrazione

    </button>


    <div id="message"></div>


</main>



<script src="app.js"></script>


</body>
